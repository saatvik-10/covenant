[toolchain]
package_manager = "yarn"
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# This Anchor project root IS the program (there is no ./programs/ dir).
# Anchor 0.31.1 only falls back to <root>/programs/* when [workspace].members
# is empty, so without this it discovers zero programs and `anchor build`
# silently exits 0 without producing a .so.
[workspace]
members = ["."]

[programs.devnet]
covenant = "Cb5yZqPKS9utNAf6LB3Cb4r36tMHpKtaY8LeNjtkwRAi"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]
